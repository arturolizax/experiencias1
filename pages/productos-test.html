<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mujer Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <base href="/">

</head>

<body>
    <header>
        <div id="menu-container"></div>
      </header>
    <div class="wrapper">
        <header class="header-mobile">
            <h1 class="logo">MUJER PRO</h1>
            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>
        </header>


        <aside>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>
            <!-- <header>
                <img src="../img/vestidos/CPFMesa de trabajo 3 copia 2.png" alt="Aquí hay una imagen" height="85%"
                    width="75%">
                <div class="banner">
                    <div class="capa">
                        <div class="contenido">
                            <H1> Bienvenida</H1>
                        </div>
                    </div>
                </div>

            </header> -->
           
            <figure>
                <center>
                    <a src="../index.html"></a><img src="../img/vestidos/CPFMesa de trabajo 2.png" alt="Aquí hay una imagen" height="90%"
                    width="50%"> </a>
                </center>
            </figure>
            <nav>
                <ul class="menu">
                    <li>
                        <a src="../index.html"></a><i> Inicio</i> </a>
                    </li>
                    <li>
                        <button id="todos" class="boton-menu boton-categoria active"><i
                                class="bi bi-hand-index-thumb-fill"></i> Todos los productos</button>
                    </li>
                    <li>
                        <button id="vestidos" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i>
                            Vestidos</button>
                    </li>
                    <li>
                        <button id="blusas" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i>
                            Blusas</button>
                    </li>
                    <li>
                        <button id="abrigos" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i>
                            Abrigos</button>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito" href="./carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito <span id="numerito" class="numerito">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2024 Tienda Mujer PRO</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
            <div id="contenedor-productos" class="contenedor-productos">

            </div>
        </main>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/menu.js"></script>
    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <script>
      // Cargar el menú dinámicamente
      fetch('/pages/menu.html')
          .then(response => response.text())
          .then(data => {
              document.getElementById('menu-container').innerHTML = data;
          })
          .catch(error => console.error('Error al cargar el menú:', error));
  </script>
</body>

</html>
